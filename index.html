<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskflow</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-900 font-sans">
    <!-- Header -->
    <header class="bg-white shadow-md p-4 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span class="text-xl font-bold">TaskFlow</span>
        </div>
        <button id="theme-toggle" class="p-2 rounded hover:bg-gray-200">
            🌙
        </button>
    </header>

    <div class="flex flex-col md:flex-row min-h-screen">
        <!-- Sidebar -->
        <nav class="bg-white w-full md:w-64 border-r border-gray-200 p-4 space-y-2">
            <ul class="space-y-1">
                <li><a href="#" class="block py-2 px-3 rounded hover:bg-gray-100">All Tasks</a></li>
                <li><a href="#" class="block py-2 px-3 rounded hover:bg-gray-100">Today</a></li>
                <li><a href="#" class="block py-2 px-3 rounded hover:bg-gray-100">Upcoming</a></li>
                <li><a href="#" class="block py-2 px-3 rounded hover:bg-gray-100">Completed</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="flex-1 p-4">
            <!-- Statistics -->
            <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-white p-4 rounded shadow">
                    <h2 class="text-lg font-semibold mb-2">Total Tasks</h2>
                    <p id="stat-total-tasks" class="text-2xl font-bold text-gray-800">0</p>
                </div>
                <div class="bg-white p-4 rounded shadow">
                    <h2 class="text-lg font-semibold mb-2">Completed</h2>
                    <p id="stat-completed-tasks" class="text-2xl font-bold text-green-600">0</p>
                </div>
                <div class="bg-white p-4 rounded shadow">
                    <h2 class="text-lg font-semibold mb-2">Pending</h2>
                    <p id="stat-pending-tasks" class="text-2xl font-bold text-indigo-600">0</p>
                </div>
            </section>
            <!-- Search & Filters -->
            <section class="flex items-center space-x-3 mb-4">
                <div class="relative flex-1">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <input type="text" id="search-task-title" placeholder="Search tasks by title..."
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white shadow-sm" />
                </div>
                <button id="open-filter-modal-btn" type="button"
                    class="relative inline-flex items-center space-x-2 px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm transition-colors cursor-pointer">
                    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
                    </svg>
                    <span class="font-medium hidden sm:inline">Filter & Sort</span>
                    <span id="filter-active-badge" class="hidden absolute -top-1 -right-1 flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-indigo-600"></span>
                    </span>
                </button>
            </section>
            <!-- Task List -->
            <section class="bg-white rounded shadow p-4">
                <h2 class="text-xl font-semibold mb-4">Tasks</h2>
                <ul id="task-list" class="space-y-2">
                </ul>
                <button id="add-task-btn"
                    class="mt-4 w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700">Add Task</button>
            </section>
        </main>
    </div>

    <div id="task-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h3 class="text-lg font-semibold mb-4">Add New Task</h3>

            <input type="text" id="task-title" placeholder="Task title"
                class="w-full border border-gray-300 rounded p-2 mb-4" />

            <textarea id="task-desc" placeholder="Task description (optional)"
                class="w-full border border-gray-300 rounded p-2 mb-4"></textarea>

            <select id="task-category" class="w-full border border-gray-300 rounded p-2 mb-4">
                <option value="" disabled selected>Select category</option>
                <option value="work">Work</option>
                <option value="personal">Personal</option>
                <option value="study">Study</option>
                <option value="other">Other</option>
            </select>

            <select id="task-priority" class="w-full border border-gray-300 rounded p-2 mb-4">
                <option value="" disabled selected>Select priority</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>

            <input type="date" id="task-due" class="w-full border border-gray-300 rounded p-2 mb-4" />

            <div class="flex justify-end space-x-2">
                <button id="cancel-modal" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">Cancel</button>
                <button id="save-task"
                    class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">Save</button>
            </div>
        </div>
    </div>

    <div id="view-task-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h3 class="text-lg font-semibold mb-4 border-b pb-2">Task Details</h3>
            <div class="space-y-4">
                <div>
                    <h4 class="text-sm text-gray-500 font-medium">Title</h4>
                    <p id="view-task-title" class="text-gray-900 font-medium"></p>
                </div>
                <div>
                    <h4 class="text-sm text-gray-500 font-medium">Description</h4>
                    <p id="view-task-desc" class="text-gray-900 whitespace-pre-wrap"></p>
                </div>
                <div class="flex justify-between">
                    <div>
                        <h4 class="text-sm text-gray-500 font-medium">Category</h4>
                        <p id="view-task-category" class="text-gray-900"></p>
                    </div>
                    <div>
                        <h4 class="text-sm text-gray-500 font-medium">Priority</h4>
                        <p id="view-task-priority" class="text-gray-900"></p>
                    </div>
                    <div>
                        <h4 class="text-sm text-gray-500 font-medium">Due Date</h4>
                        <p id="view-task-due" class="text-gray-900"></p>
                    </div>
                </div>
                <div>
                    <h4 class="text-sm text-gray-500 font-medium">Status</h4>
                    <p id="view-task-status" class="text-gray-900"></p>
                </div>
            </div>
            <div class="flex justify-end mt-6">
                <button id="close-view-modal" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">Close</button>
            </div>
        </div>
    </div>

    <!-- Filter & Sort Modal -->
    <div id="filter-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
            <!-- Modal Header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
                <div class="flex items-center space-x-2">
                    <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
                    </svg>
                    <h3 class="text-lg font-semibold text-gray-900">Filter & Sort Tasks</h3>
                </div>
                <button id="close-filter-modal-x" type="button" class="text-gray-400 hover:text-gray-600 p-1 rounded-lg focus:outline-none cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="p-6 space-y-5 max-h-[75vh] overflow-y-auto">
                <!-- Sorting Section -->
                <div>
                    <label for="modal-sort-by" class="block text-sm font-semibold text-gray-800 mb-2">Sort By</label>
                    <div class="relative">
                        <select id="modal-sort-by" class="w-full border border-gray-300 rounded-lg p-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm text-gray-800 cursor-pointer">
                            <option value="newest">Newest</option>
                            <option value="oldest">Oldest</option>
                            <option value="priority">Priority</option>
                            <option value="dueDate">DueDate</option>
                            <option value="alphabetical">Alphabetical</option>
                        </select>
                    </div>
                </div>

                <div class="border-t border-gray-100 pt-4">
                    <span class="block text-sm font-semibold text-gray-800 mb-3">Filter Options</span>
                    
                    <div class="space-y-4">
                        <!-- Category Filter -->
                        <div>
                            <label for="modal-filter-category" class="block text-xs font-medium text-gray-500 mb-1">Category</label>
                            <select id="modal-filter-category" class="w-full border border-gray-300 rounded-lg p-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm text-gray-800 cursor-pointer">
                                <option value="">All Categories</option>
                                <option value="Work">Work</option>
                                <option value="Personal">Personal</option>
                                <option value="Study">Study</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <!-- Priority Filter -->
                        <div>
                            <label for="modal-filter-priority" class="block text-xs font-medium text-gray-500 mb-1">Priority</label>
                            <select id="modal-filter-priority" class="w-full border border-gray-300 rounded-lg p-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm text-gray-800 cursor-pointer">
                                <option value="">All Priorities</option>
                                <option value="High">High</option>
                                <option value="Medium">Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>

                        <!-- Status Filter -->
                        <div>
                            <label for="modal-filter-status" class="block text-xs font-medium text-gray-500 mb-1">Status</label>
                            <select id="modal-filter-status" class="w-full border border-gray-300 rounded-lg p-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm text-gray-800 cursor-pointer">
                                <option value="All">All</option>
                                <option value="Pending" selected>Pending</option>
                                <option value="Completed">Completed</option>
                                <option value="Rejected">Rejected</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="flex items-center justify-between px-6 py-4 bg-gray-50 border-t border-gray-100">
                <button id="reset-filter-modal-btn" type="button" class="text-sm font-medium text-gray-500 hover:text-red-600 transition-colors focus:outline-none cursor-pointer">
                    Reset All
                </button>
                <div class="flex items-center space-x-2">
                    <button id="cancel-filter-modal-btn" type="button" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 transition-colors cursor-pointer">
                        Cancel
                    </button>
                    <button id="apply-filter-modal-btn" type="button" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 shadow-sm transition-colors cursor-pointer">
                        Apply
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="./src/main.js"></script>
</body>

</html>
